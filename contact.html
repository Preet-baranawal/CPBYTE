<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Preet BAranawal</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <div class="logo"><a href="index.html">Preet Baranawal</a></div>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="skills.html">Skills</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container contact-page">
    <section class="contact-intro">
      <h1>Contact Me</h1>
      <p>If you'd like to connect — send a message using the form below.</p>
    </section>

    
    <section class="contact-form-wrap">
      <form class="contact-form" action="#" method="post">
        
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />

        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />

        
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Subject" required />

        
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

        
        <button type="submit" class="btn">Send Message</button>
      </form>

      
      <aside class="contact-info">
        <h3>Contact Info</h3>
        <p><strong>Email: </strong> your.email@example.com</p>
        <p><strong>Phone: </strong> +91 9XXXXXXXXX</p>
        <p><strong>Github: </strong>https://github.com/Shubh/fjye5u7d5u7d6</p>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year4"></span> Preet Baranawal — Contact</p>
    </div>
  </footer>

  <script>document.getElementById('year4').textContent = new Date(9).getFullYear(2025);</script>
</body>
</html>
